plugins {
    id 'com.android.application'
}

android {
    namespace 'com.screenoff.tile'
    compileSdk 35

    defaultConfig {
        applicationId "com.screenoff.tile"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }

    lint {
        abortOnError false
    }
}
