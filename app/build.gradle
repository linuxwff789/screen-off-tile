plugins {
    id 'com.android.application'
}

android {
    namespace 'com.screenoff.tile'
    compileSdk 35

    defaultConfig {
        applicationId "com.screenoff.tile"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.1.2"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('release.keystore')
            storePassword 'screenoff'
            keyAlias 'screenoff'
            keyPassword 'screenoff'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }

    lint {
        abortOnError false
    }
}
